spring.application.name=essentiaUser

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/essentia}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=
server.port=8081

# JWT
jwt.secret=${JWT_SECRET:essentiaSecretKeyForDevelopmentOnlyDoNotUseInProd}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Upload foto profilo — directory locale (./uploads) o volume Docker (/uploads via UPLOAD_DIR env)
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB