spring.application.name=essentiaCatalog

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/essentia}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=

# JWT — must match the secret used in essentiauser
jwt.secret=${JWT_SECRET:essentiaSecretKeyForDevelopmentOnlyDoNotUseInProd}
jwt.expiration=${JWT_EXPIRATION:86400000}