server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # SPA fallback — tutte le route React vengono servite da index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse proxy verso i backend ────────────────────────────────
    location /api/catalog/ {
        proxy_pass         http://essentia-catalog:8082;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /api/auth/ {
        proxy_pass         http://essentia-user:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /api/user/ {
        proxy_pass         http://essentia-user:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /api/admin/ {
        proxy_pass         http://essentia-admin:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Cache asset statici — esclusi i percorsi /api/ (immagini caricate via BE)
    location ~* ^(?!/api/).*\.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
